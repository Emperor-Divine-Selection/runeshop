[workspace]
members = ["migration"]

[package]
name = "runeshop"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
dotenvy = "0.15.7"
fred = "10.1.0"
regex = "1.13.1"
sea-orm = { version = "2.0.3", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "cors"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
