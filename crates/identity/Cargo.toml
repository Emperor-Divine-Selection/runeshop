[package]
name = "identity"
version.workspace = true
edition.workspace = true

[build-dependencies]
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.3.0"

[dependencies]
tonic = "0.14.9"
prost = "0.14.5"
tonic-reflection = "0.14.9"
base64 = "0.23.1"
common = { path = "../common" }
dotenvy = "0.15.7"
getrandom = "0.4.3"
redis = { version = "1.8.2", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
] }
sea-orm = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { workspace = true }
