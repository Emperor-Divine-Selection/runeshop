[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version = "1.85.0"
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
sea-orm = { version = "2.0.0", features = [
    "runtime-tokio-rustls",   # ASYNC_RUNTIME
    "sqlx-postgres",          # DATABASE_DRIVER
    "macros",
    "with-chrono",
    "with-rust_decimal",
    "with-uuid",
] }

[dependencies.sea-orm-migration]
version  = "2.0.0"
features = ["runtime-tokio-rustls", "sqlx-postgres"]
