services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: runeshop
      POSTGRES_PASSWORD: runeshop
      POSTGRES_DB: runeshop_ops
      PGDATABASE: runeshop_ops
      PGUSER: runeshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "runeshop", "-d", "runeshop_ops"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    command: ["valkey-server", "--appendonly", "yes"]

volumes:
  pgdata:
  valkeydata:
