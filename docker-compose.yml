services:
  postgres:
    image: postgres:17-alpine
    container_name: runeshop-postgres
    environment:
      POSTGRES_USER: runeshop
      POSTGRES_PASSWORD: runeshop
      POSTGRES_DB: runeshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runeshop"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: runeshop-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: runeshop-garage
    ports:
      - "3900:3900"   # S3 API（后端连这个）
      - "3902:3902"   # 静态网站 / 公开读图片
      - "3903:3903"   # 管理 API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  garagedata:
