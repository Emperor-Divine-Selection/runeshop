services:
  postgres:
    image: postgres:17-alpine
    container_name: runeshop-postgres
    environment:
      POSTGRES_USER: runeshop
      POSTGRES_PASSWORD: runeshop
      POSTGRES_DB: runeshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runeshop"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: runeshop-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  valkeydata:
